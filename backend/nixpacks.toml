# Fallback si Railway no usa Dockerfile
[phases.setup]
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
cmds = ["dotnet restore --no-cache"]

[phases.build]
cmds = [
  "dotnet publish --no-restore -c Release -o out --self-contained true -r linux-x64",
  "chmod +x out/FlexoAPP.API"
]

[start]
cmd = "ASPNETCORE_URLS=http://+:$PORT ./out/FlexoAPP.API"
