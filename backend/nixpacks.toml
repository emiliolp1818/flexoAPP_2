# Configuración Nixpacks - BACKEND .NET 8
[phases.setup]
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
cmds = ["dotnet restore"]

[phases.build]
cmds = [
  "dotnet publish --no-restore -c Release -o out --self-contained true -r linux-x64",
  "chmod +x out/FlexoAPP.API"
]

[start]
cmd = "./out/FlexoAPP.API --urls http://0.0.0.0:$PORT"
