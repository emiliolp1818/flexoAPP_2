<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Datos de Prueba</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🗄️ Crear Datos de Prueba para Máquinas</h1>
    
    <button onclick="createTestData()">Crear Datos de Prueba</button>
    <button onclick="checkData()">Verificar Datos</button>
    
    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:7003/api/maquinas';

        async function createTestData() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">🔄 Creando datos de prueba...</div>';
            
            // Datos de prueba simplificados
            const testPrograms = [
                {
                    articulo: 'F204567',
                    numeroMaquina: 11,
                    otSap: 'OT123456',
                    cliente: 'ABSORBENTES DE COLOMBIA S.A',
                    referencia: 'REF-001',
                    td: 'TD1',
                    numeroColores: 4,
                    colores: ['CYAN', 'MAGENTA', 'AMARILLO', 'NEGRO'],
                    kilos: 1500.00,
                    fechaTintaEnMaquina: new Date().toISOString(),
                    sustrato: 'BOPP',
                    estado: 'LISTO'
                },
                {
                    articulo: 'F204568',
                    numeroMaquina: 11,
                    otSap: 'OT123457',
                    cliente: 'PRODUCTOS FAMILIA S.A',
                    referencia: 'REF-002',
                    td: 'TD2',
                    numeroColores: 3,
                    colores: ['CYAN', 'MAGENTA', 'AMARILLO'],
                    kilos: 2000.00,
                    fechaTintaEnMaquina: new Date().toISOString(),
                    sustrato: 'PE',
                    estado: 'PREPARANDO'
                },
                {
                    articulo: 'F204569',
                    numeroMaquina: 12,
                    otSap: 'OT123458',
                    cliente: 'EMPAQUES DEL VALLE LTDA',
                    referencia: 'REF-003',
                    td: 'TD3',
                    numeroColores: 5,
                    colores: ['CYAN', 'MAGENTA', 'AMARILLO', 'NEGRO', 'PANTONE 186C'],
                    kilos: 1200.00,
                    fechaTintaEnMaquina: new Date().toISOString(),
                    sustrato: 'PET',
                    estado: 'CORRIENDO'
                }
            ];

            let results = [];
            
            for (let program of testPrograms) {
                try {
                    // Intentar crear usando el endpoint de test
                    const response = await fetch(`${API_URL}/test`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(program)
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        results.push(`✅ ${program.articulo}: Creado exitosamente`);
                    } else {
                        const error = await response.text();
                        results.push(`❌ ${program.articulo}: Error ${response.status} - ${error}`);
                    }
                } catch (error) {
                    results.push(`❌ ${program.articulo}: Error de conexión - ${error.message}`);
                }
            }
            
            resultDiv.innerHTML = `
                <div class="info">📋 Resultados:</div>
                <pre>${results.join('\n')}</pre>
            `;
        }

        async function checkData() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">🔄 Verificando datos...</div>';
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ Datos verificados</div>
                        <div class="info">📊 Total de programas: ${data.data?.length || 0}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ Error verificando datos</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Error de conexión: ${error.message}</div>
                `;
            }
        }

        // Verificar datos automáticamente al cargar
        window.onload = checkData;
    </script>
</body>
</html>
