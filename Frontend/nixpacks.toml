# Configuración de Nixpacks para Railway - FRONTEND Angular
# Angular 20 requiere: ^20.19.0 || ^22.12.0 || >=24.0.0
# nodejs_22 en nixpkgs da v22.11 (insuficiente), usamos nodejs_24

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build:railway"]

[start]
cmd = "npx serve -s dist/flexoapp/browser -l $PORT --no-clipboard"
