<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Backend - Módulo de Máquinas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .loading { color: #007bff; }
    </style>
</head>
<body>
    <h1>🧪 Test Backend - Módulo de Máquinas</h1>
    
    <div class="test-section">
        <h3>1. Test de Conexión al Backend</h3>
        <button onclick="testConnection()">Probar Conexión</button>
        <div id="connection-result"></div>
    </div>

    <div class="test-section">
        <h3>2. Test de Obtener Máquinas</h3>
        <button onclick="testGetMachines()">Obtener Máquinas</button>
        <div id="machines-result"></div>
    </div>

    <div class="test-section">
        <h3>3. Test de Cambio de Estado</h3>
        <input type="text" id="machine-id" placeholder="ID de máquina (ej: F204567)" style="width: 200px;">
        <select id="new-status">
            <option value="PREPARANDO">PREPARANDO</option>
            <option value="LISTO">LISTO</option>
            <option value="CORRIENDO">CORRIENDO</option>
            <option value="SUSPENDIDO">SUSPENDIDO</option>
            <option value="TERMINADO">TERMINADO</option>
        </select>
        <button onclick="testChangeStatus()">Cambiar Estado</button>
        <div id="status-result"></div>
    </div>

    <div class="test-section">
        <h3>4. Test de Crear Registro de Prueba</h3>
        <button onclick="testCreateRecord()">Crear Registro de Prueba</button>
        <div id="create-result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:7003/api';

        async function testConnection() {
            const resultDiv = document.getElementById('connection-result');
            resultDiv.innerHTML = '<div class="loading">🔄 Probando conexión...</div>';
            
            try {
                const response = await fetch(`${API_URL}/maquinas/test-raw`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Conexión exitosa</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Error en la respuesta</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Error de conexión</h4>
                        <p>No se puede conectar al backend en ${API_URL}</p>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testGetMachines() {
            const resultDiv = document.getElementById('machines-result');
            resultDiv.innerHTML = '<div class="loading">🔄 Obteniendo máquinas...</div>';
            
            try {
                const response = await fetch(`${API_URL}/maquinas`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Máquinas obtenidas (${data.data?.length || 0} registros)</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Error obteniendo máquinas</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Error de conexión</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testChangeStatus() {
            const machineId = document.getElementById('machine-id').value;
            const newStatus = document.getElementById('new-status').value;
            const resultDiv = document.getElementById('status-result');
            
            if (!machineId) {
                resultDiv.innerHTML = '<div class="error">❌ Por favor ingresa un ID de máquina</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading">🔄 Cambiando estado...</div>';
            
            try {
                const response = await fetch(`${API_URL}/maquinas/${machineId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        Estado: newStatus,
                        Observaciones: 'Test desde página de prueba'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Estado cambiado exitosamente</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Error cambiando estado</h4>
                            <p>Status: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Error de conexión</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testCreateRecord() {
            const resultDiv = document.getElementById('create-result');
            resultDiv.innerHTML = '<div class="loading">🔄 Creando registro de prueba...</div>';
            
            try {
                const response = await fetch(`${API_URL}/maquinas/test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Registro creado exitosamente</h4>
                            <p>Puedes usar el ID: <strong>${data.data?.id}</strong> para probar el cambio de estado</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                    
                    // Llenar automáticamente el campo de ID de máquina
                    if (data.data?.id) {
                        document.getElementById('machine-id').value = data.data.id;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Error creando registro</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Error de conexión</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Ejecutar test de conexión automáticamente al cargar la página
        window.onload = function() {
            testConnection();
        };
    </script>
</body>
</html>
