# Configuración de Nixpacks para Railway
# Este archivo le dice a Railway cómo construir y ejecutar la aplicación

[phases.setup]
# Instalar .NET 8 SDK
nixPkgs = ["dotnet-sdk_8"]

[phases.build]
# Comando para compilar el backend
cmds = [
  "cd backend",
  "dotnet restore",
  "dotnet build --configuration Release"
]

[phases.install]
# No necesitamos instalar dependencias adicionales
cmds = []

[start]
# Comando para iniciar la aplicación
# Railway proporciona la variable $PORT automáticamente
cmd = "cd backend && dotnet run --configuration Release --urls http://0.0.0.0:$PORT"
