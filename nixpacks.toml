# Configuración de Nixpacks para Railway - BACKEND
# Este archivo le dice a Railway cómo construir y ejecutar el BACKEND
# IMPORTANTE: En Railway, configura "Root Directory" = "backend"

[phases.setup]
# Instalar .NET 8 SDK
nixPkgs = ["dotnet-sdk_8"]

[phases.build]
# Comando para compilar el backend
# Como Root Directory es "backend", ya estamos en esa carpeta
cmds = [
  "dotnet restore",
  "dotnet build --configuration Release"
]

[phases.install]
# No necesitamos instalar dependencias adicionales
cmds = []

[start]
# Comando para iniciar la aplicación
# Railway proporciona la variable $PORT automáticamente
cmd = "dotnet run --configuration Release --urls http://0.0.0.0:$PORT"
