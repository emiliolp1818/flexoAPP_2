# Configuración de Nixpacks para Railway - BACKEND
# Este archivo le dice a Railway cómo construir y ejecutar el BACKEND
# IMPORTANTE: En Railway, configura "Root Directory" = "backend"

[phases.setup]
# Instalar .NET 8 SDK
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
# Restaurar dependencias
cmds = ["dotnet restore"]

[phases.build]
# Publicar el proyecto en modo Release
cmds = ["dotnet publish --no-restore -c Release -o out"]

[start]
# Comando para iniciar la aplicación
# Ejecutar el DLL publicado
# Railway proporciona la variable $PORT automáticamente
cmd = "cd out && dotnet FlexoAPP.API.dll --urls http://0.0.0.0:$PORT"
